<!DOCTYPE html>
<!-- Render-Template für Bitmap-Favicons. Rendern via build-favicons.ps1. -->
<html>
<head>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100vw; height:100vh; }
body {
  background: #ffffff;
  display: grid;
  place-items: center;
}
svg { width: 80%; height: 80%; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <rect x="6" y="40" width="62" height="3.2" fill="#fff"/>
  <rect x="6" y="50" width="62" height="3.2" fill="#fff"/>
  <rect x="6" y="60" width="62" height="3.2" fill="#fff"/>
</svg>
</body>
</html>
